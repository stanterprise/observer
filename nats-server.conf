# NATS JetStream Configuration
# Observer Service - Test Event Broker

# Enable JetStream
jetstream {
  store_dir: "/data"
  max_file_store: 10GB
}

# Set max payload to 16 MiB (16777216 bytes)
max_payload: 16777216

# Monitoring port
http_port: 8222

# Cluster settings (optional for single-node setup)
# cluster {
#   port: 6222
# }
