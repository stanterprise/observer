{{- if and (eq .Values.mode "distributed") .Values.distributed.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observer.fullname" . }}-api
  labels:
    {{- include "observer.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.distributed.api.autoscaling.enabled }}
  replicas: {{ .Values.distributed.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "observer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "observer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "observer.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: api
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: {{ include "observer.image" (dict "component" "api" "Values" .Values "Chart" .Chart) }}
        imagePullPolicy: {{ include "observer.image.pullPolicy" . }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: NATS_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "observer.runtimeSecretName" . }}
              key: NATS_URL
        {{- if and (not .Values.runtime.existingSecret) .Values.postgresql.enabled }}
        - name: POSTGRES_HOST
          value: {{ include "observer.postgres.host" . | quote }}
        - name: POSTGRES_PORT
          value: {{ include "observer.postgres.port" . | quote }}
        - name: POSTGRES_USER
          value: {{ include "observer.postgres.user" . | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "postgresql.v1.secretName" .Subcharts.postgresql }}
              key: {{ include "postgresql.v1.userPasswordKey" .Subcharts.postgresql }}
        - name: POSTGRES_DB
          value: {{ include "observer.postgres.db" . | quote }}
        - name: POSTGRES_SSLMODE
          value: disable
        {{- end }}
        {{- if or .Values.runtime.existingSecret (not .Values.postgresql.enabled) }}
        - name: POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: {{ include "observer.runtimeSecretName" . }}
              key: POSTGRES_DSN
        {{- end }}
        {{- if and (not .Values.runtime.existingSecret) .Values.mongodb.enabled }}
        - name: MONGO_HOST
          value: {{ printf "%s-mongodb" (include "observer.fullname" .) | quote }}
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_USER
          value: {{ .Values.mongodb.auth.rootUser | default "root" | quote }}
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "mongodb.secretName" .Subcharts.mongodb }}
              key: mongodb-root-password
        - name: MONGO_DATABASE
          value: {{ index .Values.mongodb.auth.databases 0 | default "observer" | quote }}
        - name: MONGO_AUTH_SOURCE
          value: admin
        {{- end }}
        {{- if or .Values.runtime.existingSecret (not .Values.mongodb.enabled) }}
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: {{ include "observer.runtimeSecretName" . }}
              key: MONGODB_URI
        {{- end }}
        {{- if and .Values.customCA .Values.customCA.existingSecret (not (hasKey (.Values.distributed.api.env | default dict) "AWS_CA_BUNDLE")) (not (hasKey (.Values.extraEnv | default dict) "AWS_CA_BUNDLE")) }}
        - name: AWS_CA_BUNDLE
          value: {{ printf "%s/ca.crt" (.Values.customCA.mountPath | default "/etc/ssl/certs/custom-ca") | quote }}
        {{- end }}
{{ include "observer.renderFilteredEnv" (dict "env" .Values.distributed.api.env "excluded" (list "NATS_URL" "POSTGRES_DSN" "MONGODB_URI")) | nindent 8 }}
        {{- with .Values.extraEnv }}
        {{- range $key, $value := . }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        {{- if and .Values.storage .Values.storage.s3 .Values.storage.s3.existingSecret }}
        envFrom:
        - secretRef:
            name: {{ .Values.storage.s3.existingSecret }}
        {{- end }}
        {{- with .Values.extraEnvFrom }}
        {{- if and $.Values.storage $.Values.storage.s3 $.Values.storage.s3.existingSecret }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        envFrom:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.distributed.api.resources | nindent 10 }}
        {{- if or (and .Values.customCA .Values.customCA.existingSecret) .Values.extraVolumeMounts }}
        volumeMounts:
        {{- if and .Values.customCA .Values.customCA.existingSecret }}
        - name: custom-ca
          mountPath: {{ .Values.customCA.mountPath | default "/etc/ssl/certs/custom-ca" }}
          readOnly: true
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- if or (and .Values.customCA .Values.customCA.existingSecret) .Values.extraVolumes }}
      volumes:
      {{- if and .Values.customCA .Values.customCA.existingSecret }}
      - name: custom-ca
        secret:
          secretName: {{ .Values.customCA.existingSecret }}
      {{- end }}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
